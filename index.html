<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Board Game League</title>
<meta name="theme-color" content="#2f5d50">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="BGL">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<style>
:root{--bg:#f6f6f3;--card:#fff;--bd:#e4e3dd;--tx:#1f2421;--mu:#6b7069;--ac:#2f5d50;--ac2:#e8efec;--er:#b3261e;--er2:#fbeae8}
@media(prefers-color-scheme:dark){:root{--bg:#161816;--card:#1f221f;--bd:#33372f;--tx:#ecece7;--mu:#9a9f96;--ac:#7fb5a3;--ac2:#243029;--er:#f2b8b5;--er2:#3b1f1d}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.45 system-ui,-apple-system,"Segoe UI",sans-serif;-webkit-text-size-adjust:100%}
#app{max-width:720px;margin:0 auto;padding:calc(12px + env(safe-area-inset-top)) 14px calc(90px + env(safe-area-inset-bottom))}
header{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:12px}
h1{font-size:19px;margin:0;font-weight:650}h2{font-size:16px;margin:0 0 10px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:14px;margin-bottom:12px}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}.sp{justify-content:space-between;flex-wrap:nowrap;margin:6px 0}
.mu,small{color:var(--mu)}.w{width:100%}
input,select,button{font:inherit;color:var(--tx)}
input,select{background:var(--card);border:1px solid var(--bd);border-radius:10px;padding:10px 12px;max-width:100%;min-height:44px}
button{cursor:pointer;min-height:44px}
.b{background:var(--card);border:1px solid var(--bd);border-radius:10px;padding:8px 14px}
.p{background:var(--ac);border-color:var(--ac);color:var(--card);font-weight:600}.p:disabled{opacity:.45}
.link{background:none;border:0;color:var(--ac);padding:6px;font-size:14px}
.ib{background:none;border:1px solid var(--bd);border-radius:50%;width:44px;padding:0;display:flex;align-items:center;justify-content:center;color:var(--mu)}
svg{width:24px;height:24px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
nav{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--bd);display:flex;justify-content:center;padding-bottom:env(safe-area-inset-bottom);z-index:5}
nav button{flex:1;max-width:240px;background:none;border:0;display:flex;flex-direction:column;align-items:center;gap:2px;padding:8px 4px;font-size:12px;color:var(--mu)}
nav button.on{color:var(--ac);font-weight:600}
.seg{display:flex;border:1px solid var(--bd);border-radius:10px;overflow:hidden;margin-bottom:12px;background:var(--card)}
.seg button{flex:1;background:none;border:0;padding:10px}.seg button.on{background:var(--ac);color:var(--card);font-weight:600}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;text-align:center}
.big{font-size:28px;font-weight:700;color:var(--ac);line-height:1.1}
.bars{display:grid;grid-template-columns:1fr 1fr;gap:10px 16px;margin-top:12px;font-size:13px}
.bar{height:6px;background:var(--bd);border-radius:3px;overflow:hidden;margin-top:3px}.bar i{display:block;height:100%;background:var(--ac)}
.hint{background:var(--ac2);border-radius:10px;padding:10px 12px;margin-bottom:12px;font-size:14px}
.tr{display:grid;grid-template-columns:86px 1fr 1fr;gap:8px;align-items:stretch;margin-bottom:8px}
.tn{display:flex;flex-direction:column;justify-content:center}.tn small{font-size:12px}
.chip{border:1px dashed var(--bd);border-radius:10px;padding:8px;font-size:13px;color:var(--mu);display:flex;justify-content:space-between;gap:6px;align-items:center;min-height:48px}
.chip.full{border:1px solid var(--ac);background:var(--ac2);color:var(--tx)}.chip b{color:var(--ac)}
.pill{display:inline-block;background:var(--ac2);color:var(--ac);border-radius:20px;padding:2px 10px;font-size:12px;font-weight:600}
.pk{display:inline-flex;align-items:center;border:1px solid var(--bd);background:var(--card);border-radius:22px;padding:8px 14px;margin:0 6px 8px 0;font-size:15px}
.pk.on{background:var(--ac);border-color:var(--ac);color:var(--card)}.pk:disabled{opacity:.6}
.rk{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid var(--bd)}.rk b:first-child{width:34px;color:var(--ac)}
.hc{display:flex;justify-content:space-between;gap:8px;padding:10px 0;border-bottom:1px solid var(--bd)}
.top{display:grid;gap:10px;grid-template-columns:repeat(auto-fit,minmax(190px,1fr))}.top .card{margin:0;text-align:center}
.ok{border-color:var(--ac);background:var(--ac2)}.err{color:var(--er)}.bad{background:var(--er2);border-color:var(--er)}
.tbl{overflow-x:auto}table{border-collapse:collapse;width:100%;font-size:14px}
th,td{text-align:left;padding:7px 8px;border-bottom:1px solid var(--bd);white-space:nowrap}th{color:var(--mu);font-weight:500}
tr.bad td{background:var(--er2);color:var(--er)}
.sub{display:flex;gap:6px;overflow-x:auto;margin-bottom:12px;padding-bottom:4px}.sub button{white-space:nowrap}
.who{margin:-6px 0 12px;font-size:14px;color:var(--mu)}.who .link{padding:2px 6px;min-height:0}
.tn{background:none;border:0;text-align:left;padding:0;color:var(--tx)}.tn b{color:var(--ac)}
.tp{margin:-2px 0 10px;padding:8px 12px}.tp .sp{margin:4px 0;font-size:14px}
.bdg{position:absolute;top:2px;right:calc(50% - 24px);background:var(--er);color:#fff;border-radius:10px;font-size:11px;min-width:18px;padding:0 5px;line-height:18px;text-align:center}
nav button{position:relative}
details.card{padding:0}details.card summary{padding:14px;cursor:pointer;font-weight:600;list-style:none;display:flex;justify-content:space-between}
details.card summary::-webkit-details-marker{display:none}details.card .in{padding:0 14px 8px}
.danger{background:var(--er);border-color:var(--er);color:#fff}.tile{text-align:center}
.hc.bad{padding:10px;border-radius:8px;margin:4px 0;border:1px solid var(--er)}
.sec{margin:22px 0 10px}.dots{letter-spacing:2px;color:var(--ac)}.b:disabled{opacity:.45}
.li{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;margin:7px 0}.li .nm{flex:1;min-width:0;overflow-wrap:anywhere}.li .mt{flex:none;text-align:right}
.chip span{min-width:0;overflow-wrap:anywhere}.hc>div{min-width:0;overflow-wrap:anywhere}
.ar{display:flex;flex-wrap:wrap;align-items:center;gap:8px;padding:9px 0;border-bottom:1px solid var(--bd)}.ar .nm{flex:1 1 170px;min-width:0;overflow-wrap:anywhere}.ar .ac{display:flex;gap:6px;flex:none}
.ar.bad{background:var(--er2);padding:10px;border-radius:8px;border:1px solid var(--er);margin:6px 0}
.b.s{padding:6px 12px;min-height:36px}
.pl{display:inline-flex;border:1px solid var(--bd);border-radius:16px;overflow:hidden;margin-bottom:10px}.pl button{min-height:32px;padding:0 16px;font-size:13px;background:none;border:0}.pl button.on{background:var(--ac2);color:var(--ac);font-weight:600}
.rt td:first-child,.rt th:first-child{position:sticky;left:0;background:var(--card)}
ul{margin:6px 0;padding-left:20px}li{margin:3px 0}
.load{height:3px;background:var(--ac);margin:-6px 0 10px;animation:ld 1s infinite alternate;border-radius:2px}@keyframes ld{from{width:10%}to{width:90%}}
#msg{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom));transform:translateX(-50%);background:var(--tx);color:var(--bg);padding:9px 16px;border-radius:10px;display:none;max-width:90%;z-index:9}
@media(min-width:700px){#app{padding-bottom:100px}}
</style></head><body><div id="app">Loading…</div><div id="msg"></div>
<script>
const API_URL='https://script.google.com/macros/s/AKfycbylineVYJMcLU1wJTExM8rK9xNjlXQytHZJkhMixJj4GoMLaoH0UOidElepfzLV6J2Y/exec';
const S={code:localStorage.getItem('bgl_c')||'',player:localStorage.getItem('bgl_p')||'',pass:sessionStorage.getItem('bgl_a')||'',
  tab:'progress',view:'qual',rules:false,lb:'top',hv:'date',open:-1,atab:'ranking',sub:'awards',ev:null,edit:null,gt:{},imp:null,late:null,lmode:'game',admin:false,sec:'ranking',d:null,busy:false,s:null,g:null,done:null,q:'',err:''};
const $=q=>document.querySelector(q),val=id=>$('#'+id).value;
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const today=()=>new Date().toISOString().slice(0,10);
const ord=i=>['1st','2nd','3rd'][i]||(i+1)+'th';
const tog=(a,v)=>{const i=a.indexOf(v);i<0?a.push(v):a.splice(i,1)};
const ICON={progress:'<path d="M4 20V11M10 20V4M16 20v-6M22 20H2"/>',log:'<rect x="4" y="4" width="16" height="16" rx="3"/><path d="M12 8v8M8 12h8"/>',
  board:'<path d="M8 4h8v5a4 4 0 0 1-8 0V4zM8 6H4v2a3 3 0 0 0 4 2.8M16 6h4v2a3 3 0 0 1-4 2.8M12 13v4M8 20h8M10 17h4"/>',
  rank:'<path d="M8 6h13M8 12h13M8 18h13M3 6h.01M3 12h.01M3 18h.01"/>',clip:'<rect x="6" y="4" width="12" height="17" rx="2"/><path d="M9 4h6v3H9zM9 12h6M9 16h4"/>',
  gear:'<circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/>',
    help:'<circle cx="12" cy="12" r="9"/><path d="M9.5 9a2.5 2.5 0 1 1 3.5 2.3c-.7.4-1 1-1 1.7M12 17h.01"/>',
  crown:'<path d="M3 8l4 4 5-7 5 7 4-4-2 11H5z"/>',
  thumb:'<path d="M10 15v4a3 3 0 0 0 3 3l4-9V2H5.7a2 2 0 0 0-2 1.7l-1.4 9a2 2 0 0 0 2 2.3zm7-13h2.7A2.3 2.3 0 0 1 22 4v7a2.3 2.3 0 0 1-2.3 2H17"/>',
  temple:'<path d="M3 9l9-5 9 5M5 9v9M9 9v9M15 9v9M19 9v9M3 20h18"/>',
  spark:'<path d="M12 3l1.8 5.2L19 10l-5.2 1.8L12 17l-1.8-5.2L5 10l5.2-1.8zM19 16l.8 2.2L22 19l-2.2.8L19 22l-.8-2.2L16 19l2.2-.8z"/>',
  medal:'<circle cx="12" cy="9" r="5"/><path d="M8.5 13.5L7 21l5-3 5 3-1.5-7.5"/>',
  lock:'<rect x="5" y="11" width="14" height="9" rx="2"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/>'};
const svg=k=>`<svg viewBox="0 0 24 24">${ICON[k]}</svg>`;
const svgS=(k,n)=>`<svg viewBox="0 0 24 24" style="width:${n}px;height:${n}px;vertical-align:-3px">${ICON[k]}</svg>`;
function flash(t){const m=$('#msg');m.textContent=t;m.style.display='block';clearTimeout(flash.t);flash.t=setTimeout(()=>m.style.display='none',2800)}

/* ---------- data ---------- */
async function api(action,extra){
  const r=await fetch(API_URL,{method:'POST',body:JSON.stringify(Object.assign({code:S.code,player:S.player,pass:S.pass,action},extra||{}))});
  return r.json()}
async function load(){
  if(!S.code){render();return}
  S.busy=true;render();
  try{const r=await api('init');
    if(r.error==='code'){S.code='';localStorage.removeItem('bgl_c');S.err='That access code was not accepted.';S.d=null}
    else if(r.error){S.err=r.error}
    else{S.err='';S.d=r;r._t=Date.now();
      if(!r.admin&&S.player)localStorage.setItem('bgl_cache_'+S.player,JSON.stringify(r));
      if(S.pass&&!r.admin){S.pass='';sessionStorage.removeItem('bgl_a');S.passErr=true}}}
  catch(e){S.err='Could not reach the server. Check your connection and the API_URL.'}
  S.busy=false;render()}
async function act(action,extra){
  flash('Saving…');
  try{const r=await api(action,extra);
    if(r.dup){$('#msg').style.display='none';return r}
    if(r.error){flash(r.error==='code'?'Access code not accepted':r.error);return null}
    flash('Saved');await load();return r}
  catch(e){flash('Network error');return null}}

/* ---------- shell ---------- */
function navHtml(items,cur,fn){return `<nav>${items.map(x=>`<button class="${cur===x[0]?'on':''}" onclick="${fn}('${x[0]}')">${svg(x[2]||x[0])}${x[1]}${x[3]?`<span class="bdg">${x[3]}</span>`:''}</button>`).join('')}</nav>`}
function render(){
  const a=$('#app');
  if(!S.code){a.innerHTML=codeV();return}
  if(!S.d){a.innerHTML=hdr()+`<div class="card ${S.err?'err':'mu'}">${esc(S.err||'Loading…')}</div>`;return}
  if(S.rules){a.innerHTML=hdr()+rulesV();return}
  if(S.admin){const n=S.d.admin?Object.keys(S.d.flags).length:0;
    a.innerHTML=hdr()+adminV()+(S.d.admin?navHtml([['ranking','Ranking','rank'],['entries','Entries','clip',n||''],['settings','Settings','gear']],S.atab,'goA'):'');return}
  if(!S.player){a.innerHTML=hdr()+pickV();return}
  a.innerHTML=hdr()+({progress:progV,log:logV,board:boardV})[S.tab]()+navHtml([['progress','Progress'],['log','Log'],['board','Leaderboard']],S.tab,'goT')}
function goT(t){S.tab=t;render();scrollTo(0,0)}function goA(t){S.atab=t;S.edit=null;render();scrollTo(0,0)}
function hdr(){return `<header><h1>🎲 Board Game League</h1><div class="row" style="flex-wrap:nowrap"><button class="ib" onclick="S.rules=!S.rules;S.admin=false;render();scrollTo(0,0)" aria-label="Rules">${svg('help')}</button><button class="ib" onclick="S.admin=!S.admin;S.rules=false;S.edit=null;render()" aria-label="Admin">${svg('lock')}</button></div></header>
  ${S.player&&!S.admin&&!S.rules?`<div class="who">Playing as <b>${esc(S.player)}</b> · <button class="link" onclick="S.player='';localStorage.removeItem('bgl_p');render()">change</button></div>`:''}${S.busy?'<div class="load"></div>':''}`}
function codeV(){return `<div class="card"><h1>🎲 Board Game League</h1><p class="mu">Enter the league access code to continue.</p>${S.err?`<p class="err">${esc(S.err)}</p>`:''}
  <div class="row"><input id="cc" class="w" placeholder="Access code" autocomplete="off"><button class="b p w" onclick="S.code=val('cc').trim();localStorage.setItem('bgl_c',S.code);S.err='';load()">Continue</button></div></div>`}
function plist(){const q=S.q.toLowerCase();return S.d.players.filter(n=>n.toLowerCase().includes(q)).map(n=>`<button class="pk" data-n="${esc(n)}" onclick="setPlayer(this.dataset.n)">${esc(n)}</button>`).join('')||'<span class="mu">No match</span>'}
function pickV(){return `<div class="card"><h2>Who are you?</h2><input class="w" id="q" placeholder="Search your name" value="${esc(S.q)}" oninput="S.q=this.value;$('#plist').innerHTML=plist()" style="margin-bottom:12px"><div id="plist">${plist()}</div></div>`}
function setPlayer(n){
  S.player=n;localStorage.setItem('bgl_p',n);S.q='';S.s=S.g=S.done=null;S.tab='progress';
  try{const c=JSON.parse(localStorage.getItem('bgl_cache_'+n));if(c&&c.me){c.admin=false;S.d=c}}catch(e){}
  render();load()}

/* ---------- progress ---------- */
function chip(s){return s.game?`<div class="chip full"><span>${esc(s.game)}</span><b>${s.pts}</b></div>`:'<div class="chip">Not played</div>'}
const mx=t=>S.d.table[0][t];
function progV(){
  const m=S.d.me;if(!m)return '<div class="card mu">Loading your progress…</div>';
  const filled=m.slots.filter(s=>s.game).length,miss=[0,0,0,0];
  m.slots.slice(0,8).forEach((s,i)=>{if(!s.game)miss[i>>1]++});
  const flex=m.slots.slice(8).filter(s=>!s.game).length,need=[3,2,1,0].filter(t=>miss[t]).map(t=>`${miss[t]} × Tier ${t+1}`);
  const hint=filled===10?'All 10 qualifying slots are filled.':need.length?'Still to play: '+need.join(', ')+(flex?` + ${flex} any-tier`:''):`Tier slots done. ${flex} any-tier game${flex>1?'s':''} to go.`;
  const bon=[['Hosting',m.hosting],['Attending',m.attending],['Teaching',m.teaching],['Learning',m.learning]];
  const ids={};m.slots.forEach(x=>{if(x.id)ids[x.id]=1});
  const t3=S.d.top3[2],gap=t3&&m.rank>3?t3.total-m.total:0;
  let h=`<div class="card"><div class="stats"><div><div class="big">${m.total}</div><small>points</small></div><div><div class="big">#${m.rank}</div><small>rank</small></div><div><div class="big">${filled}<small>/10</small></div><small>qualifying</small></div></div>
   ${gap>0?`<p class="mu" style="margin:10px 0 0;text-align:center">${gap} point${gap>1?'s':''} behind 3rd place</p>`:''}
   <div class="bars">${bon.map(b=>`<div><div class="row sp" style="margin:0"><span>${b[0]}</span><span>${b[1]}/10</span></div><div class="bar"><i style="width:${b[1]*10}%"></i></div></div>`).join('')}</div>
   ${m.dom?`<p style="margin:12px 0 0"><span class="pill">${svgS('crown',14)} Dominator +5</span></p>`:''}${m.dem?`<p class="mu" style="margin:8px 0 0">Demerits −${m.dem}</p>`:''}</div>
   <div class="hint">${hint}</div>
   <div class="seg">${[['qual','Qualifying'],['games','Games'],['hist','History']].map(x=>`<button class="${S.view===x[0]?'on':''}" onclick="S.view='${x[0]}';render()">${x[1]}</button>`).join('')}</div>`;
  if(S.view==='qual')h+=[0,1,2,3].map(t=>`<div class="tr"><div class="tn"><b>Tier ${t+1}</b><br><small>up to ${mx(t)}</small></div>${chip(m.slots[t*2])}${chip(m.slots[t*2+1])}</div>`).join('')+
    `<div class="tr"><div class="tn"><b>Any tier</b><br><small>up to ${mx(3)}</small></div>${chip(m.slots[8])}${chip(m.slots[9])}</div>`;
  else if(S.view==='games')h+=gamesV(ids);
  else{
    h+=`<div class="pl"><button class="${S.hv==='date'?'on':''}" onclick="S.hv='date';render()">Date</button><button class="${S.hv==='tier'?'on':''}" onclick="S.hv='tier';render()">Tier</button></div>`;
    const row=x=>`<div class="hc"><div><b>${esc(x.game)}</b>${ids[x.id]?' <span class="pill">counts</span>':''}<br><small>${esc(x.date)}${S.hv==='date'?' · Tier '+x.tier:''} · ${ord(x.place-1)} of ${x.of}</small></div><b>+${x.pts}</b></div>`;
    if(S.hv==='date')h+=`<div class="card">${m.history.slice().reverse().map(row).join('')||'<span class="mu">No games yet.</span>'}</div>`;
    else h+=[3,2,1,0].map(t=>{const l=m.history.filter(x=>x.tier===t+1).sort((a,b)=>b.pts-a.pts||b.date.localeCompare(a.date));
      return `<div class="card"><div class="row sp"><b>Tier ${t+1}</b><small>${l.length} played</small></div>${l.map(row).join('')||'<small>None yet.</small>'}</div>`}).join('')}
  return h}
function gamesV(ids){
  const m=S.d.me,cnt={},cc={};
  m.history.forEach(h=>{cnt[h.game]=(cnt[h.game]||0)+1;if(ids[h.id])cc[h.game]=(cc[h.game]||0)+1});
  return '<p class="mu" style="margin:0 0 10px;font-size:14px">Dots show how many of the 2 scores allowed per game are counting in your top 10.</p>'+[1,2,3,4].map(t=>{
    const names=new Set(S.d.games.filter(g=>g.tier===t).map(g=>g.name));m.history.filter(h=>h.tier===t).forEach(h=>names.add(h.game));
    const l=[...names].sort((a,b)=>(cnt[b]||0)-(cnt[a]||0)||a.localeCompare(b));
    return `<div class="card"><div class="row sp"><b>Tier ${t}</b><small>up to ${mx(t-1)}</small></div>${l.map(n=>{const k=cc[n]||0;return `<div class="li ${cnt[n]?'':'mu'}"><span class="nm">${esc(n)}</span><span class="mt"><small>${cnt[n]?'played '+cnt[n]:'not played'}</small><br><span class="dots">${'●'.repeat(k)}${'○'.repeat(2-k)}</span>${k>=2?' <span class="pill">max</span>':''}</span></div>`}).join('')}</div>`}).join('')}
function hintG(gm){

function rulesV(){

  return `<div class="row" style="margin-bottom:10px"><button class="b" onclick="S.rules=false;render()">← Back</button></div><h2>Rules and scoring</h2>
  ${sec('How points work',`<p>Each game result scores points based on your finishing place and the game's tier. A game needs 3 to 7 players to score, and 4th place and below all score the same.</p>${tbl}<p class="mu">To see which games are in each tier, open Progress › Games.</p>`,1)}
  ${sec('Your top 10 scores',`<p>Your best 2 scores in each tier (8 scores) count, plus your next 2 best from any tier. No more than 2 scores can come from the same game. The most you can earn from playing is ${max} points.</p>`)}
  ${sec('Bonus points',`<ul><li><b>Hosting</b> (each host earns)<ul><li>1 point for 4-5 people</li><li>2 points for 6-10 people</li><li>3 points for 11 or more</li></ul></li><li><b>Attending</b><ul><li>1 point for each session you attend</li></ul></li><li><b>Teaching</b><ul><li>1 point for a Tier 1-2 game</li><li>2 points for a Tier 3-4 game</li></ul></li><li><b>Learning</b><ul><li>1 point for each new game you learn</li></ul></li></ul><p class="mu">Each category is capped at 10 points. Hosts count towards the number of people.</p>`)}
  ${sec('Accolades and demerits',`<p>The Dominator (most first-place finishes) earns bonus points and can change hands during the league. Other accolades are awarded at the end of the league. Demerits deduct points.</p>`)}
  ${sec('Logging games',`<p>A host creates the session and can add late arrivals. Any player in a game logs it. You can undo your own entry for 10 minutes after logging. After that, ask an admin to fix it.</p>`)}`}

/* ---------- log ---------- */
const people=s=>s?s.hosts.concat(s.attendees):[];
const pk=(on,n,fn,dis)=>`<button class="pk ${on?'on':''}" ${dis?'disabled':''} data-n="${esc(n)}" onclick="${fn}(this.dataset.n)">${esc(n)}</button>`;
function undoV(){
  const rec=(S.d.undo||[]).filter(u=>u.left-(Date.now()-S.d._t)>0);
  return rec.length?`<div class="card"><h2>Just logged</h2>${rec.map(u=>`<div class="row sp"><span>${esc(u.label)}</span><button class="b" data-k="${u.kind}" data-id="${esc(u.id)}" onclick="undo(this.dataset.k,this.dataset.id)">Undo</button></div>`).join('')}<small>You can undo for 10 minutes after logging.</small></div>`:''}
function logV(){
  const hosts=S.d.sessions.some(x=>x.hosts.includes(S.player));
  if(S.lmode==='late'&&!hosts)S.lmode='game';
  const o=[['game','Log a game'],['ses','Host']].concat(hosts?[['late','Late arrivals']]:[]);
  let h=`<div class="seg">${o.map(x=>`<button class="${S.lmode===x[0]?'on':''}" onclick="S.lmode='${x[0]}';render()">${x[1]}</button>`).join('')}</div>`+undoV();
  if(S.done)h+=`<div class="card ok"><b>${esc(S.done)}</b><div class="row" style="margin-top:10px"><button class="b" onclick="S.done=null;render()">Log another</button></div></div>`;
  return h+(S.lmode==='game'?gameV():S.lmode==='ses'?sesV():lateV())}
function gameV(){
  const d=S.d,sess=d.sessions.slice().sort((a,b)=>b.date.localeCompare(a.date));
  if(!sess.length)return '<div class="card mu">No sessions yet. A host needs to create one first (Host a session).</div>';
  if(S.done)return '';
  const g=S.g=S.g||{session:sess[0].id,game:'',rank:[],teachers:[],learners:[]};
  const ss=d.sessions.find(x=>x.id===g.session)||sess[0];g.session=ss.id;const ppl=people(ss),gm=d.games.find(x=>x.name===g.game);
  const left=ppl.filter(n=>!g.rank.includes(n));
  const go=[0,1,2,3].map(t=>`<optgroup label="Tier ${t+1}">${d.games.filter(x=>x.tier===t+1).sort((a,b)=>a.name.localeCompare(b.name)).map(x=>`<option ${x.name===g.game?'selected':''}>${esc(x.name)}</option>`).join('')}</optgroup>`).join('');
  return `<div class="card"><h2>1 · Session and game</h2><div class="row">
   <select class="w" onchange="S.g={session:this.value,game:S.g.game,rank:[],teachers:[],learners:[]};render()">${sess.map(x=>`<option value="${x.id}" ${x.id===ss.id?'selected':''}>${esc(x.date)} · ${esc(x.hosts.join(', '))}</option>`).join('')}</select>
   <select class="w" onchange="S.g.game=this.value;render()"><option value="">Choose game</option>${go}</select></div>${gm?hintG(gm):''}</div>
  <div class="card"><h2>2 · Tap players in finishing order</h2>
   ${g.rank.map((n,i)=>`<div class="rk"><b>${ord(i)}</b><span style="flex:1">${esc(n)}</span><small>${gm&&g.rank.length>=3?'+'+S.d.table[Math.min(i,3)][gm.tier-1]+' pts':''}</small><button class="link" onclick="untap(${i})">Remove</button></div>`).join('')}
   <div style="margin-top:10px">${left.map(n=>pk(0,n,'tapP')).join('')||'<small>Everyone is ranked.</small>'}</div>
   ${g.rank.length&&g.rank.length<3?'<small>Rank at least 3 players. You must be one of them.</small>':''}</div>
  <div class="card"><h2>3 · Teaching</h2><small>Who taught the game (can be anyone at the session)</small><div style="margin-top:8px">${ppl.map(n=>pk(g.teachers.includes(n),n,'tglT')).join('')}</div></div>
  ${g.rank.length?`<div class="card"><h2>4 · Learning</h2><small>Who learned the game for the first time</small><div style="margin-top:8px">${g.rank.map(n=>pk(g.learners.includes(n),n,'tglL')).join('')}</div></div>`:''}
  <button class="b p w" ${g.rank.length>=3&&gm?'':'disabled'} onclick="submitGame()">Submit game</button>`}
function tapP(n){S.g.rank.push(n);render()}
function untap(i){const n=S.g.rank.splice(i,1)[0];S.g.learners=S.g.learners.filter(x=>x!==n);render()}
function tglT(n){tog(S.g.teachers,n);render()}function tglL(n){tog(S.g.learners,n);render()}
async function submitGame(){
  const g=S.g,d=S.d,gm=d.games.find(x=>x.name===g.game);
  if(!gm)return flash('Choose a game');
  if(!g.rank.includes(S.player))return flash('You must be one of the players');
  if(gm.players>0&&gm.players<100&&g.rank.length>gm.players&&!confirm(`${gm.name} is listed for ${gm.players} players but you entered ${g.rank.length}. Continue?`))return;
  const i=g.rank.indexOf(S.player),pts=d.table[Math.min(i,3)][gm.tier-1],body={session:g.session,game:g.game,places:g.rank,teachers:g.teachers,learners:g.learners};
  let r=await act('addPlay',body);
  if(r&&r.dup){if(!confirm(r.dup))return;r=await act('addPlay',Object.assign({confirmDup:true},body))}
  if(r&&r.ok){S.done=`Logged: you finished ${ord(i)} in ${gm.name} (+${pts} pts)`;S.g=null;render()}}
async function undo(kind,id){if(confirm('Undo this entry?')&&await act('undo',{kind,id}))S.done=null}
function sesV(){
  const d=S.d,p=S.player,s=S.s=S.s||{date:today(),hosts:[p],attendees:[]};

  <div class="card"><h2>3 · Attendees</h2><small>${n} people · each host earns ${bn} bonus point${bn===1?'':'s'}</small><div style="margin-top:8px">${d.players.filter(x=>!s.hosts.includes(x)).map(x=>pk(s.attendees.includes(x),x,'tglA')).join('')}</div></div>
  <button class="b p w" onclick="saveSession()">Create session</button>`}
function tglH(n){const s=S.s;if(!s.hosts.includes(n)&&s.hosts.length>=6)return flash('Maximum 6 hosts');tog(s.hosts,n);s.attendees=s.attendees.filter(x=>x!==n);render()}

   <div>${d.players.filter(x=>!people(ss).includes(x)).map(x=>pk(l.add.includes(x),x,'tglLate')).join('')}</div>

/* games */

/* data */
function aData(){return `<div class="card"><h2>Backup</h2><p class="mu">Download everything (players, games, sessions, results, accolades, demerits) as a file you can re-import later.</p><button class="b p w" onclick="exportData()">Export backup</button></div>
  <div class="card"><h2>Import data</h2><p class="mu">Replaces <b>all</b> existing data with a backup file. Export a backup first.</p><button class="b p w" onclick="$('#imp').click()">Choose backup file</button><input id="imp" type="file" accept=".json" hidden onchange="pickImp(this)">
   ${S.imp?`<p style="margin:12px 0 8px">Selected: <b>${esc(S.imp.name)}</b></p><div class="row"><button class="b danger" onclick="doImp()">Replace all data</button><button class="b" onclick="S.imp=null;render()">Cancel</button></div>`:''}</div>
  <div class="card"><h2>Admin session</h2><button class="b w" onclick="S.pass='';sessionStorage.removeItem('bgl_a');S.admin=false;load()">Lock admin</button></div>`}
async function exportData(){try{const r=await api('export');if(r.error)return flash(r.error);const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(r,null,1)],{type:'application/json'}));a.download='bgl-backup-'+today()+'.json';a.click()}catch(e){flash('Export failed')}}
function pickImp(el){const f=el.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{S.imp={name:f.name,text:r.result};render()};r.readAsText(f)}
async function doImp(){if(!confirm('Replace ALL existing data with this file? This cannot be undone.'))return;
  let d;try{d=JSON.parse(S.imp.text)}catch(e){return flash('That file is not valid JSON')}
  if(await act('seed',{data:d}))S.imp=null}

/* entries */
function aEntries(){
  if(S.edit)return editV();
  const d=S.d,fl=d.flags,n=Object.keys(fl).length,mode=S.ev||(n?'review':'all');
  const ses=id=>d.allSessions.find(s=>s.id===id)||{date:'',hosts:[]};
  const eb=(k,id)=>`<button class="b s" data-id="${esc(id)}" onclick="${k}(this.dataset.id)">Edit</button>`;
  let h=`<div class="seg"><button class="${mode==='review'?'on':''}" onclick="S.ev='review';render()">Needs review (${n})</button><button class="${mode==='all'?'on':''}" onclick="S.ev='all';render()">All entries</button></div>`;
  if(mode==='review')return h+(n?d.plays.filter(p=>fl[p.id]).map(p=>`<div class="card bad"><b>${esc(p.game)}</b> <small>· ${esc(ses(p.session).date)}</small><p style="margin:4px 0">${esc(fl[p.id])}</p><small>${esc(p.places.join(' > '))}</small><div style="margin-top:10px;display:flex;gap:6px">${eb('editPlay',p.id)}${del('Plays',p.id)}</div></div>`).join(''):'<div class="card ok">Nothing needs review.</div>');
  return h+d.allSessions.slice().sort((a,b)=>b.date.localeCompare(a.date)).map(s=>`<div class="card">${ar(`<b>${esc(s.date)}</b><br><small>Hosts: ${esc(s.hosts.join(', '))} · ${s.hosts.length+s.attendees.length} people</small>`,eb('editSes',s.id)+del('Sessions',s.id))}
   ${d.plays.filter(p=>p.session===s.id).map(p=>ar(`<b>${esc(p.game)}</b><br><small>${esc(p.places.join(' > '))}</small>${fl[p.id]?'<br><small>'+esc(fl[p.id])+'</small>':''}`,eb('editPlay',p.id)+del('Plays',p.id),fl[p.id]?'bad':'')).join('')}</div>`).join('')}
function editSes(id){const s=S.d.allSessions.find(x=>x.id===id);S.edit={kind:'ses',id:id,date:s.date,hosts:s.hosts.slice(),attendees:s.attendees.slice()};render();scrollTo(0,0)}
function editPlay(id){const p=S.d.plays.find(x=>x.id===id);S.edit={kind:'play',id:id,session:p.session,game:p.game,rank:p.places.slice(),teachers:p.teachers.slice(),learners:p.learners.slice()};render();scrollTo(0,0)}
function editV(){
  const d=S.d,e=S.edit,btn=`<div class="row"><button class="b p" onclick="saveEdit()">Save changes</button><button class="b" onclick="S.edit=null;render()">Cancel</button></div>`;
  if(e.kind==='ses')return `<div class="card"><h2>Edit session</h2><input type="date" value="${esc(e.date)}" onchange="S.edit.date=this.value"></div>
   <div class="card"><h2>Hosts</h2><small>Up to 6</small><div style="margin-top:8px">${AN(d).map(x=>pk(e.hosts.includes(x),x,'eH')).join('')}</div></div>
   <div class="card"><h2>Attendees</h2><small>Anyone in a logged game must stay in the session</small><div style="margin-top:8px">${AN(d).filter(x=>!e.hosts.includes(x)).map(x=>pk(e.attendees.includes(x),x,'eA')).join('')}</div></div>`+btn;
  const ss=d.allSessions.find(x=>x.id===e.session),ppl=people(ss),gm=d.allGames.find(x=>x.name===e.game),left=ppl.filter(n=>!e.rank.includes(n));
  const go=[1,2,3,4].map(t=>`<optgroup label="Tier ${t}">${d.allGames.filter(x=>x.tier===t).sort((a,b)=>a.name.localeCompare(b.name)).map(x=>`<option ${x.name===e.game?'selected':''}>${esc(x.name)}${x.retired?'':''}</option>`).join('')}</optgroup>`).join('');
  return `<div class="card"><h2>Edit game</h2><small>${esc(ss.date)} · ${esc(ss.hosts.join(', '))}</small><select class="w" style="margin-top:8px" onchange="S.edit.game=this.value;render()">${go}</select></div>
   <div class="card"><h2>Finishing order</h2>${e.rank.map((n,i)=>`<div class="rk"><b>${ord(i)}</b><span style="flex:1">${esc(n)}</span><small>${gm&&e.rank.length>=3?'+'+d.table[Math.min(i,3)][gm.tier-1]+' pts':''}</small><button class="link" onclick="eUntap(${i})">Remove</button></div>`).join('')}
    <div style="margin-top:10px">${left.map(n=>pk(0,n,'eTap')).join('')||'<small>Everyone is ranked.</small>'}</div></div>
   <div class="card"><h2>Teaching</h2><div>${ppl.map(n=>pk(e.teachers.includes(n),n,'eT')).join('')}</div></div>
   ${e.rank.length?`<div class="card"><h2>Learning</h2><div>${e.rank.map(n=>pk(e.learners.includes(n),n,'eL')).join('')}</div></div>`:''}`+btn}
function eH(n){const e=S.edit;if(!e.hosts.includes(n)&&e.hosts.length>=6)return flash('Maximum 6 hosts');tog(e.hosts,n);e.attendees=e.attendees.filter(x=>x!==n);render()}
function eA(n){tog(S.edit.attendees,n);render()}
function eTap(n){S.edit.rank.push(n);render()}
function eUntap(i){const n=S.edit.rank.splice(i,1)[0];S.edit.learners=S.edit.learners.filter(x=>x!==n);render()}
function eT(n){tog(S.edit.teachers,n);render()}function eL(n){tog(S.edit.learners,n);render()}
async function saveEdit(){
  const e=S.edit;let ok;
  if(e.kind==='ses')ok=await act('editSession',{id:e.id,date:e.date,hosts:e.hosts,attendees:e.attendees});
  else{if(e.rank.length<3)return flash('Rank at least 3 players');ok=await act('editPlay',{id:e.id,game:e.game,places:e.rank,teachers:e.teachers,learners:e.learners.filter(x=>e.rank.includes(x))})}
  if(ok){S.edit=null;render()}}

/* instant first paint from the last visit, then refresh */
(function(){try{const c=JSON.parse(localStorage.getItem('bgl_cache_'+S.player));if(c&&c.me&&S.code){c.admin=false;S.d=c;c._t=Date.now()-9e5}}catch(e){}})();
document.addEventListener('visibilitychange',()=>{if(!document.hidden&&S.code&&S.d&&!S.busy&&Date.now()-S.d._t>30000)load()});
render();load();
</script></body></html>
