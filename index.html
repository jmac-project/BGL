<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Board Game League</title>
<meta name="theme-color" content="#2f5d50">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="BGL">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<style>
:root{--bg:#f6f6f3;--card:#fff;--bd:#e4e3dd;--tx:#1f2421;--mu:#6b7069;--ac:#2f5d50;--ac2:#e8efec;--er:#b3261e;--er2:#fbeae8}
@media(prefers-color-scheme:dark){:root{--bg:#161816;--card:#1f221f;--bd:#33372f;--tx:#ecece7;--mu:#9a9f96;--ac:#7fb5a3;--ac2:#243029;--er:#f2b8b5;--er2:#3b1f1d}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.45 system-ui,-apple-system,"Segoe UI",sans-serif;-webkit-text-size-adjust:100%}
#app{max-width:720px;margin:0 auto;padding:calc(12px + env(safe-area-inset-top)) 14px calc(90px + env(safe-area-inset-bottom))}
header{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:12px}
h1{font-size:19px;margin:0;font-weight:650}h2{font-size:16px;margin:0 0 10px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:14px;margin-bottom:12px}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}.sp{justify-content:space-between;flex-wrap:nowrap;margin:6px 0}
.mu,small{color:var(--mu)}.w{width:100%}
input,select,button{font:inherit;color:var(--tx)}
input,select{background:var(--card);border:1px solid var(--bd);border-radius:10px;padding:10px 12px;max-width:100%;min-height:44px}
button{cursor:pointer;min-height:44px}
.b{background:var(--card);border:1px solid var(--bd);border-radius:10px;padding:8px 14px}
.p{background:var(--ac);border-color:var(--ac);color:var(--card);font-weight:600}.p:disabled{opacity:.45}
.link{background:none;border:0;color:var(--ac);padding:6px;font-size:14px}
.ib{background:none;border:1px solid var(--bd);border-radius:50%;width:44px;padding:0;display:flex;align-items:center;justify-content:center;color:var(--mu)}
svg{width:24px;height:24px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
nav{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--bd);display:flex;justify-content:center;padding-bottom:env(safe-area-inset-bottom);z-index:5}
nav button{flex:1;max-width:240px;background:none;border:0;display:flex;flex-direction:column;align-items:center;gap:2px;padding:8px 4px;font-size:12px;color:var(--mu)}
nav button.on{color:var(--ac);font-weight:600}
.seg{display:flex;border:1px solid var(--bd);border-radius:10px;overflow:hidden;margin-bottom:12px;background:var(--card)}
.seg button{flex:1;background:none;border:0;padding:10px}.seg button.on{background:var(--ac);color:var(--card);font-weight:600}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;text-align:center}
.big{font-size:28px;font-weight:700;color:var(--ac);line-height:1.1}
.bars{display:grid;grid-template-columns:1fr 1fr;gap:10px 16px;margin-top:12px;font-size:13px}
.bar{height:6px;background:var(--bd);border-radius:3px;overflow:hidden;margin-top:3px}.bar i{display:block;height:100%;background:var(--ac)}
.hint{background:var(--ac2);border-radius:10px;padding:10px 12px;margin-bottom:12px;font-size:14px}
.tr{display:grid;grid-template-columns:86px 1fr 1fr;gap:8px;align-items:stretch;margin-bottom:8px}
.tn{display:flex;flex-direction:column;justify-content:center}.tn small{font-size:12px}
.chip{border:1px dashed var(--bd);border-radius:10px;padding:8px;font-size:13px;color:var(--mu);display:flex;justify-content:space-between;gap:6px;align-items:center;min-height:48px}
.chip.full{border:1px solid var(--ac);background:var(--ac2);color:var(--tx)}.chip b{color:var(--ac)}
.pill{display:inline-block;background:var(--ac2);color:var(--ac);border-radius:20px;padding:2px 10px;font-size:12px;font-weight:600}
.pk{display:inline-flex;align-items:center;border:1px solid var(--bd);background:var(--card);border-radius:22px;padding:8px 14px;margin:0 6px 8px 0;font-size:15px}
.pk.on{background:var(--ac);border-color:var(--ac);color:var(--card)}.pk:disabled{opacity:.6}
.rk{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid var(--bd)}.rk b:first-child{width:34px;color:var(--ac)}
.hc{display:flex;justify-content:space-between;gap:8px;padding:10px 0;border-bottom:1px solid var(--bd)}
.top{display:grid;gap:10px;grid-template-columns:repeat(auto-fit,minmax(190px,1fr))}.top .card{margin:0;text-align:center}
.ok{border-color:var(--ac);background:var(--ac2)}.err{color:var(--er)}.bad{background:var(--er2);border-color:var(--er)}
.tbl{overflow-x:auto}table{border-collapse:collapse;width:100%;font-size:14px}
th,td{text-align:left;padding:7px 8px;border-bottom:1px solid var(--bd);white-space:nowrap}th{color:var(--mu);font-weight:500}
tr.bad td{background:var(--er2);color:var(--er)}
.sub{display:flex;gap:6px;overflow-x:auto;margin-bottom:12px;padding-bottom:4px}.sub button{white-space:nowrap}
.load{height:3px;background:var(--ac);margin:-6px 0 10px;animation:ld 1s infinite alternate;border-radius:2px}@keyframes ld{from{width:10%}to{width:90%}}
#msg{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom));transform:translateX(-50%);background:var(--tx);color:var(--bg);padding:9px 16px;border-radius:10px;display:none;max-width:90%;z-index:9}
@media(min-width:700px){#app{padding-bottom:100px}}
</style></head><body><div id="app">Loading…</div><div id="msg"></div>
<script>
const API_URL='https://script.google.com/macros/s/AKfycbylineVYJMcLU1wJTExM8rK9xNjlXQytHZJkhMixJj4GoMLaoH0UOidElepfzLV6J2Y/exec';
const NAMES=['Gateway','Light','Medium','Heavy'];
const S={code:localStorage.getItem('bgl_c')||'',player:localStorage.getItem('bgl_p')||'',pass:sessionStorage.getItem('bgl_a')||'',
  tab:'progress',view:'qual',lmode:'game',admin:false,sec:'ranking',d:null,busy:false,s:null,g:null,done:null,q:'',err:''};
const $=q=>document.querySelector(q),val=id=>$('#'+id).value;
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const today=()=>new Date().toISOString().slice(0,10);
const ord=i=>['1st','2nd','3rd'][i]||(i+1)+'th';
const tog=(a,v)=>{const i=a.indexOf(v);i<0?a.push(v):a.splice(i,1)};
const ICON={progress:'<path d="M4 20V11M10 20V4M16 20v-6M22 20H2"/>',log:'<rect x="4" y="4" width="16" height="16" rx="3"/><path d="M12 8v8M8 12h8"/>',
  board:'<path d="M8 4h8v5a4 4 0 0 1-8 0V4zM8 6H4v2a3 3 0 0 0 4 2.8M16 6h4v2a3 3 0 0 1-4 2.8M12 13v4M8 20h8M10 17h4"/>',
  lock:'<rect x="5" y="11" width="14" height="9" rx="2"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/>'};
const svg=k=>`<svg viewBox="0 0 24 24">${ICON[k]}</svg>`;
function flash(t){const m=$('#msg');m.textContent=t;m.style.display='block';clearTimeout(flash.t);flash.t=setTimeout(()=>m.style.display='none',2800)}

/* ---------- data ---------- */
async function api(action,extra){
  const r=await fetch(API_URL,{method:'POST',body:JSON.stringify(Object.assign({code:S.code,player:S.player,pass:S.pass,action},extra||{}))});
  return r.json()}
async function load(){
  if(!S.code){render();return}
  S.busy=true;render();
  try{const r=await api('init');
    if(r.error==='code'){S.code='';localStorage.removeItem('bgl_c');S.err='That access code was not accepted.';S.d=null}
    else if(r.error){S.err=r.error}
    else{S.err='';S.d=r;r._t=Date.now();
      if(!r.admin&&S.player)localStorage.setItem('bgl_cache_'+S.player,JSON.stringify(r));
      if(S.pass&&!r.admin){S.pass='';sessionStorage.removeItem('bgl_a');S.passErr=true}}}
  catch(e){S.err='Could not reach the server. Check your connection and the API_URL.'}
  S.busy=false;render()}
async function act(action,extra){
  flash('Saving…');
  try{const r=await api(action,extra);
    if(r.error){flash(r.error==='code'?'Access code not accepted':r.error);return null}
    flash('Saved');await load();return r}
  catch(e){flash('Network error');return null}}

/* ---------- shell ---------- */
function render(){
  const a=$('#app');
  if(!S.code){a.innerHTML=codeV();return}
  if(!S.d){a.innerHTML=hdr()+`<div class="card ${S.err?'err':'mu'}">${esc(S.err||'Loading…')}</div>`;return}
  if(S.admin){a.innerHTML=hdr()+adminV();return}
  if(!S.player){a.innerHTML=hdr()+pickV();return}
  const t=[['progress','Progress'],['log','Log'],['board','Leaderboard']];
  a.innerHTML=hdr()+({progress:progV,log:logV,board:boardV})[S.tab]()+
    `<nav>${t.map(x=>`<button class="${S.tab===x[0]?'on':''}" onclick="S.tab='${x[0]}';render();scrollTo(0,0)">${svg(x[0])}${x[1]}</button>`).join('')}</nav>`}
function hdr(){return `<header><h1>🎲 Board Game League</h1><div class="row">${S.player&&!S.admin?`<button class="link" onclick="S.player='';localStorage.removeItem('bgl_p');render()">${esc(S.player)} · change</button>`:''}
  <button class="ib" onclick="S.admin=!S.admin;render()" aria-label="Admin">${svg('lock')}</button></div></header>${S.busy?'<div class="load"></div>':''}`}
function codeV(){return `<div class="card"><h1>🎲 Board Game League</h1><p class="mu">Enter the league access code to continue.</p>${S.err?`<p class="err">${esc(S.err)}</p>`:''}
  <div class="row"><input id="cc" class="w" placeholder="Access code" autocomplete="off"><button class="b p w" onclick="S.code=val('cc').trim();localStorage.setItem('bgl_c',S.code);S.err='';load()">Continue</button></div></div>`}
function plist(){const q=S.q.toLowerCase();return S.d.players.filter(n=>n.toLowerCase().includes(q)).map(n=>`<button class="pk" data-n="${esc(n)}" onclick="setPlayer(this.dataset.n)">${esc(n)}</button>`).join('')||'<span class="mu">No match</span>'}
function pickV(){return `<div class="card"><h2>Who are you?</h2><input class="w" id="q" placeholder="Search your name" value="${esc(S.q)}" oninput="S.q=this.value;$('#plist').innerHTML=plist()" style="margin-bottom:12px"><div id="plist">${plist()}</div></div>`}
function setPlayer(n){
  S.player=n;localStorage.setItem('bgl_p',n);S.q='';S.s=S.g=S.done=null;S.tab='progress';
  try{const c=JSON.parse(localStorage.getItem('bgl_cache_'+n));if(c&&c.me){c.admin=false;S.d=c}}catch(e){}
  render();load()}

/* ---------- progress ---------- */
function chip(s){return s.game?`<div class="chip full"><span>${esc(s.game)}</span><b>${s.pts}</b></div>`:'<div class="chip">Not played</div>'}
function progV(){
  const m=S.d.me;if(!m)return '<div class="card mu">Loading your progress…</div>';
  const filled=m.slots.filter(s=>s.game).length,miss=[0,0,0,0];
  m.slots.slice(0,8).forEach((s,i)=>{if(!s.game)miss[i>>1]++});
  const flex=m.slots.slice(8).filter(s=>!s.game).length,need=[3,2,1,0].filter(t=>miss[t]).map(t=>`${miss[t]} × ${NAMES[t]}`);
  const hint=filled===10?'All 10 qualifying slots are filled.':need.length?'Still to play: '+need.join(', ')+(flex?` + ${flex} any-tier`:''):`Tier slots done. ${flex} any-tier game${flex>1?'s':''} to go.`;
  const bon=[['Hosting',m.hosting],['Attending',m.attending],['Teaching',m.teaching],['Learning',m.learning]];
  let h=`<div class="card"><div class="stats"><div><div class="big">${m.total}</div><small>points</small></div><div><div class="big">#${m.rank}</div><small>rank</small></div><div><div class="big">${filled}<small>/10</small></div><small>qualifying</small></div></div>
   <div class="bars">${bon.map(b=>`<div><div class="row sp" style="margin:0"><span>${b[0]}</span><span>${b[1]}/10</span></div><div class="bar"><i style="width:${b[1]*10}%"></i></div></div>`).join('')}</div>
   ${m.dom?'<p style="margin:12px 0 0"><span class="pill">Dominator +5</span></p>':''}${m.dem?`<p class="mu" style="margin:8px 0 0">Demerits −${m.dem}</p>`:''}</div>
   <div class="hint">${hint}</div>
   <div class="seg"><button class="${S.view==='qual'?'on':''}" onclick="S.view='qual';render()">Qualifying</button><button class="${S.view==='hist'?'on':''}" onclick="S.view='hist';render()">History</button></div>`;
  if(S.view==='qual'){
    h+=[0,1,2,3].map(t=>`<div class="tr"><div class="tn"><b>Tier ${t+1}</b><small>${NAMES[t]}</small></div>${chip(m.slots[t*2])}${chip(m.slots[t*2+1])}</div>`).join('')+
      `<div class="tr"><div class="tn"><b>Any tier</b><small>Next best</small></div>${chip(m.slots[8])}${chip(m.slots[9])}</div>`;
  }else h+=`<div class="card">${m.history.slice().reverse().map(x=>`<div class="hc"><div><b>${esc(x.game)}</b><br><small>${esc(x.date)} · Tier ${x.tier} · ${ord(x.place-1)} of ${x.of}</small></div><b>+${x.pts}</b></div>`).join('')||'<span class="mu">No games yet.</span>'}</div>`;
  return h}

/* ---------- leaderboard ---------- */
function boardV(){
  const d=S.d,dm=d.dominator;
  return `<h2>Top 3</h2><div class="top">${d.top3.map(p=>`<div class="card"><small>Rank ${p.rank}</small><h2 style="margin:4px 0">${esc(p.name)}</h2><div class="big">${p.total}</div><small>points</small>${p.dom?'<div style="margin-top:8px"><span class="pill">Dominator</span></div>':''}</div>`).join('')||'<div class="card mu">No scores yet.</div>'}</div>
   ${dm.count?`<div class="card" style="margin-top:12px"><small>Current Dominator · most first-place finishes</small><h2 style="margin:4px 0 0">${esc(dm.names.join(', '))}</h2><small>${dm.count} first-place finishes · +${dm.points} points</small></div>`:''}`}

/* ---------- log ---------- */
const people=s=>s?s.hosts.concat(s.attendees):[];
const pk=(on,n,fn,dis)=>`<button class="pk ${on?'on':''}" ${dis?'disabled':''} data-n="${esc(n)}" onclick="${fn}(this.dataset.n)">${esc(n)}</button>`;
function undoV(){
  const rec=(S.d.undo||[]).filter(u=>u.left-(Date.now()-S.d._t)>0);
  return rec.length?`<div class="card"><h2>Just logged</h2>${rec.map(u=>`<div class="row sp"><span>${esc(u.label)}</span><button class="b" data-k="${u.kind}" data-id="${esc(u.id)}" onclick="undo(this.dataset.k,this.dataset.id)">Undo</button></div>`).join('')}<small>You can undo for 10 minutes after logging.</small></div>`:''}
function logV(){
  let h=`<div class="seg"><button class="${S.lmode==='game'?'on':''}" onclick="S.lmode='game';render()">Log a game</button><button class="${S.lmode==='ses'?'on':''}" onclick="S.lmode='ses';render()">Host a session</button></div>`+undoV();
  if(S.done)h+=`<div class="card ok"><b>${esc(S.done)}</b><div class="row" style="margin-top:10px"><button class="b" onclick="S.done=null;render()">Log another</button></div></div>`;
  return h+(S.lmode==='game'?gameV():sesV())}
function gameV(){
  const d=S.d,sess=d.sessions.slice().sort((a,b)=>b.date.localeCompare(a.date));
  if(!sess.length)return '<div class="card mu">No sessions yet. A host needs to create one first (Host a session).</div>';
  if(S.done)return '';
  const g=S.g=S.g||{session:sess[0].id,game:'',rank:[],teachers:[],learners:[]};
  const ss=d.sessions.find(x=>x.id===g.session)||sess[0];g.session=ss.id;const ppl=people(ss),gm=d.games.find(x=>x.name===g.game);
  const left=ppl.filter(n=>!g.rank.includes(n));
  const go=[0,1,2,3].map(t=>`<optgroup label="Tier ${t+1} · ${NAMES[t]}">${d.games.filter(x=>x.tier===t+1).sort((a,b)=>a.name.localeCompare(b.name)).map(x=>`<option ${x.name===g.game?'selected':''}>${esc(x.name)}</option>`).join('')}</optgroup>`).join('');
  return `<div class="card"><h2>1 · Session and game</h2><div class="row">
   <select class="w" onchange="S.g={session:this.value,game:S.g.game,rank:[],teachers:[],learners:[]};render()">${sess.map(x=>`<option value="${x.id}" ${x.id===ss.id?'selected':''}>${esc(x.date)} · ${esc(x.hosts.join(', '))}</option>`).join('')}</select>
   <select class="w" onchange="S.g.game=this.value;render()"><option value="">Choose game</option>${go}</select></div></div>
  <div class="card"><h2>2 · Tap players in finishing order</h2>
   ${g.rank.map((n,i)=>`<div class="rk"><b>${ord(i)}</b><span style="flex:1">${esc(n)}</span><small>${gm&&g.rank.length>=3?'+'+S.d.table[Math.min(i,3)][gm.tier-1]+' pts':''}</small><button class="link" onclick="untap(${i})">Remove</button></div>`).join('')}
   <div style="margin-top:10px">${left.map(n=>pk(0,n,'tapP')).join('')||'<small>Everyone is ranked.</small>'}</div>
   ${g.rank.length&&g.rank.length<3?'<small>Rank at least 3 players. You must be one of them.</small>':''}</div>
  <div class="card"><h2>3 · Teaching and learning</h2><small>Who taught the game (can be anyone at the session)</small><div style="margin:6px 0 10px">${ppl.map(n=>pk(g.teachers.includes(n),n,'tglT')).join('')}</div>
   <small>Who learned it for the first time</small><div style="margin-top:6px">${g.rank.map(n=>pk(g.learners.includes(n),n,'tglL')).join('')||'<small>Rank players first.</small>'}</div></div>
  <button class="b p w" ${g.rank.length>=3&&gm?'':'disabled'} onclick="submitGame()">Submit game</button>`}
function tapP(n){S.g.rank.push(n);render()}
function untap(i){const n=S.g.rank.splice(i,1)[0];S.g.learners=S.g.learners.filter(x=>x!==n);render()}
function tglT(n){tog(S.g.teachers,n);render()}function tglL(n){tog(S.g.learners,n);render()}
async function submitGame(){
  const g=S.g,d=S.d,gm=d.games.find(x=>x.name===g.game);
  if(!gm)return flash('Choose a game');
  if(!g.rank.includes(S.player))return flash('You must be one of the players');
  if(gm.players>0&&gm.players<100&&g.rank.length>gm.players&&!confirm(`${gm.name} is listed for ${gm.players} players but you entered ${g.rank.length}. Continue?`))return;
  const i=g.rank.indexOf(S.player),pts=d.table[Math.min(i,3)][gm.tier-1];
  const r=await act('addPlay',{session:g.session,game:g.game,places:g.rank,teachers:g.teachers,learners:g.learners});
  if(r){S.done=`Logged: you finished ${ord(i)} in ${gm.name} (+${pts} pts)`;S.g=null;render()}}
async function undo(kind,id){if(confirm('Undo this entry?')&&await act('undo',{kind,id}))S.done=null}
function sesV(){
  const d=S.d,p=S.player,s=S.s=S.s||{date:today(),hosts:[p],attendees:[]};
  if(!s.hosts.includes(p))s.hosts.unshift(p);
  const last=d.sessions.slice().sort((a,b)=>b.date.localeCompare(a.date))[0];
  return `<div class="card"><h2>New session</h2><input type="date" value="${s.date}" onchange="S.s.date=this.value" style="margin-bottom:12px">
   ${last?'<div><button class="b" onclick="copyLast()">Copy my last session</button></div>':''}
   <p class="mu" style="margin:12px 0 6px">Hosts (you plus up to 5 more)</p>${d.players.map(n=>pk(s.hosts.includes(n),n,'tglH',n===p)).join('')}
   <p class="mu" style="margin:6px 0">Attendees</p>${d.players.filter(n=>!s.hosts.includes(n)).map(n=>pk(s.attendees.includes(n),n,'tglA')).join('')}</div>
  <button class="b p w" onclick="saveSession()">Create session</button>`}
function tglH(n){const s=S.s;if(!s.hosts.includes(n)&&s.hosts.length>=6)return flash('Maximum 6 hosts');tog(s.hosts,n);s.attendees=s.attendees.filter(x=>x!==n);render()}
function tglA(n){tog(S.s.attendees,n);render()}
function copyLast(){const d=S.d,p=S.player,l=d.sessions.slice().sort((a,b)=>b.date.localeCompare(a.date))[0],h=[p].concat(l.hosts.filter(x=>x!==p)).slice(0,6);
  S.s={date:today(),hosts:h,attendees:l.attendees.filter(x=>!h.includes(x))};render()}
async function saveSession(){if(await act('addSession',S.s)){S.s=null;S.done='Session created. You can now log games in it.';S.lmode='game';render()}}

/* ---------- admin ---------- */
const del=(t,id)=>`<button class="b" data-t="${t}" data-id="${esc(id)}" onclick="delE(this.dataset.t,this.dataset.id)">Delete</button>`;
function delE(t,id){if(confirm('Delete this entry? Deleting a session also deletes its games.'))act('delete',{tab:t,id})}
const opts=(a,id)=>`<select id="${id}">${a.map(x=>`<option>${esc(x)}</option>`).join('')}</select>`;
function adminV(){
  const d=S.d;
  if(!d.admin)return `<div class="card"><h2>Admin access</h2>${S.passErr?'<p class="err">Passcode not accepted.</p>':''}<div class="row"><input id="pw" type="password" placeholder="Admin passcode" class="w"><button class="b p w" onclick="S.pass=val('pw');S.passErr=false;sessionStorage.setItem('bgl_a',S.pass);load()">Unlock</button><button class="b w" onclick="S.admin=false;render()">Back to the app</button></div></div>`;
  const secs=[['ranking','Ranking'],['games','Games'],['players','Players'],['awards','Awards'],['entries','Entries'+(Object.keys(d.flags).length?' ('+Object.keys(d.flags).length+')':'')],['data','Data']];
  return `<div class="row" style="margin-bottom:10px"><button class="b" onclick="S.admin=false;render()">← Exit admin</button><button class="b" onclick="S.pass='';sessionStorage.removeItem('bgl_a');S.admin=false;load()">Lock</button></div>
   <div class="sub">${secs.map(s=>`<button class="b ${S.sec===s[0]?'p':''}" onclick="S.sec='${s[0]}';render()">${s[1]}</button>`).join('')}</div>`+({ranking:aRank,games:aGames,players:aPlayers,awards:aAwards,entries:aEntries,data:aData})[S.sec]()}
function aRank(){return `<div class="card"><h2>Full ranking</h2><p class="mu">Total is what players see${S.d.reveal?'':' (hidden accolades excluded)'}. Projected includes all accolades.</p><div class="tbl"><table><tr><th>#</th><th>Player</th><th>Play</th><th>Host</th><th>Att</th><th>Teach</th><th>Learn</th><th>Dem</th><th>Dom</th><th>Hidden</th><th>Total</th><th>Proj (#)</th></tr>
  ${S.d.ranking.map(r=>`<tr><td>${r.rank}</td><td>${esc(r.name)}</td><td>${r.playing}</td><td>${r.hosting}</td><td>${r.attending}</td><td>${r.teaching}</td><td>${r.learning}</td><td>${r.dem}</td><td>${r.dom}</td><td>${r.hidden}</td><td><b>${r.total}</b></td><td>${r.proj} (#${r.projRank})</td></tr>`).join('')}</table></div></div>`}
function aGames(){const d=S.d;return `<div class="card"><h2>Add or edit a game</h2><div class="row"><input id="gn" placeholder="Game name" class="w"><select id="gt"><option value="1">Tier 1 · Gateway</option><option value="2">Tier 2 · Light</option><option value="3">Tier 3 · Medium</option><option value="4">Tier 4 · Heavy</option></select><input id="gp" type="number" placeholder="Players (optional)" style="width:150px"><button class="b p" onclick="saveGame()">Save</button></div><small>Player count is optional and only triggers a warning when logging.</small></div>
  <div class="card tbl"><table><tr><th>Game</th><th>Tier</th><th>Players</th><th></th></tr>${d.allGames.map((g,i)=>`<tr style="${g.retired?'opacity:.5':''}"><td>${esc(g.name)}${g.retired?' (retired)':''}</td><td>${g.tier}</td><td>${g.players||'–'}</td><td><button class="b" onclick="editGame(${i})">Edit</button> <button class="b" data-n="${esc(g.name)}" onclick="act('retireGame',{name:this.dataset.n,retired:${!g.retired}})">${g.retired?'Restore':'Retire'}</button></td></tr>`).join('')}</table></div>`}
function saveGame(){const n=val('gn').trim();if(!n)return flash('Enter a name');act('saveGame',{old:S.old||'',game:{name:n,players:+val('gp')||0,tier:+val('gt')}});S.old=''}
function editGame(i){const g=S.d.allGames[i];S.old=g.name;$('#gn').value=g.name;$('#gt').value=g.tier;$('#gp').value=g.players||'';$('#gn').scrollIntoView({block:'center'})}
function aPlayers(){return `<div class="card"><h2>Add a player</h2><div class="row"><input id="pn" placeholder="Full name" class="w"><button class="b p" onclick="act('addPlayer',{name:val('pn').trim()})">Add player</button></div></div><div class="card">${S.d.players.map(esc).join(' · ')}</div>`}
function aAwards(){const d=S.d;return `<div class="card"><h2>Automatic accolades (live)</h2>${Object.keys(d.auto).map(k=>{const a=d.auto[k];return `<div class="row sp"><span><b>${k}</b> · ${esc(a.names.join(', ')||'none yet')}</span><small>${a.count} · +${a.points}${k==='Dominator'?' (public)':''}</small></div>`}).join('')}
   <p class="mu">Ties after the higher-tier tie-break share the points. 8th Wonder and voted accolades are entered below.</p></div>
  <div class="card ${d.reveal?'ok':''}"><h2>Season-end reveal</h2><p class="mu">${d.reveal?'Accolades are counted in players\u2019 totals.':'All accolades except Dominator are hidden from players and excluded from their totals.'}</p><button class="b p" onclick="if(confirm('${d.reveal?'Hide':'Reveal'} accolade points for all players?'))act('setReveal',{on:${!d.reveal}})">${d.reveal?'Hide accolades again':'Reveal accolades to players'}</button></div>
  <div class="card"><h2>Manual accolades</h2><div class="row"><input id="at" placeholder="Title (e.g. 8th Wonder)" class="w">${opts(d.players,'ap')}<input id="apt" type="number" placeholder="Pts" style="width:90px"><button class="b p" onclick="act('addAccolade',{title:val('at'),person:val('ap'),points:+val('apt')})">Add</button></div>
   ${d.accolades.map(a=>`<div class="row sp"><span>${esc(a.title)} · ${esc(a.person)} · +${a.points}</span>${del('Accolades',a.id)}</div>`).join('')}</div>
  <div class="card"><h2>Demerits</h2><p class="mu">Applied to totals immediately.</p><div class="row"><input id="dd" type="date" value="${today()}"><input id="dr" placeholder="Reason" class="w">${opts(d.players,'dp')}<input id="dpt" type="number" placeholder="Pts" style="width:90px"><button class="b p" onclick="act('addDemerit',{date:val('dd'),reason:val('dr'),person:val('dp'),points:+val('dpt')})">Add</button></div>
   ${d.demerits.map(a=>`<div class="row sp"><span>${esc(a.date)} · ${esc(a.person)} · −${a.points} · ${esc(a.reason)}</span>${del('Demerits',a.id)}</div>`).join('')}</div>`}
function aEntries(){const d=S.d,n=Object.keys(d.flags).length;
  return `<div class="card ${n?'bad':''}"><b>${n?n+' entr'+(n>1?'ies need':'y needs')+' review (shown in red)':'No entries need review'}</b><p class="mu" style="margin:6px 0 0">To correct an entry, delete it and log it again.</p></div>
  <div class="card tbl"><table>${d.allSessions.slice().sort((a,b)=>b.date.localeCompare(a.date)).map(s=>`<tr><td><b>${esc(s.date)}</b></td><td>Hosts: ${esc(s.hosts.join(', '))}</td><td>${s.hosts.length+s.attendees.length} people</td><td>${del('Sessions',s.id)}</td></tr>${d.plays.filter(p=>p.session===s.id).map(p=>`<tr class="${d.flags[p.id]?'bad':''}"><td></td><td>${esc(p.game)}${d.flags[p.id]?'<br><small>'+esc(d.flags[p.id])+'</small>':''}</td><td>${esc(p.places.join(' > '))}</td><td>${del('Plays',p.id)}</td></tr>`).join('')}`).join('')}</table></div>`}
function aData(){return `<div class="card"><h2>Backup</h2><p class="mu">Download everything (players, games, sessions, results, accolades, demerits) as a file you can re-import later.</p><button class="b p" onclick="exportData()">Export backup</button></div>
  <div class="card bad"><h2>Import data</h2><p>This <b>replaces all existing data</b> with the file. Export a backup first.</p><input type="file" accept=".json" onchange="seedFile(this)"></div>`}
async function exportData(){try{const r=await api('export');if(r.error)return flash(r.error);const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(r,null,1)],{type:'application/json'}));a.download='bgl-backup-'+today()+'.json';a.click()}catch(e){flash('Export failed')}}
function seedFile(el){const f=el.files[0];if(!f)return;
  if(!confirm('Replace ALL existing data with this file? Have you exported a backup?')){el.value='';return}
  const r=new FileReader();r.onload=()=>{try{act('seed',{data:JSON.parse(r.result)})}catch(e){flash('That file is not valid JSON')}};r.readAsText(f)}

/* instant first paint from the last visit, then refresh */
(function(){try{const c=JSON.parse(localStorage.getItem('bgl_cache_'+S.player));if(c&&c.me&&S.code){c.admin=false;S.d=c;c._t=Date.now()-9e5}}catch(e){}})();
render();load();
</script></body></html>
