<style>

:root[data-acc=terracotta][data-theme=dark]{--ac:#e0a08a;--ac2:#382620}:root[data-acc=plum][data-theme=dark]{--ac:#c4a5d8;--ac2:#2e2536}
@media(prefers-color-scheme:dark){:root[data-acc=terracotta]:not([data-theme=light]){--ac:#e0a08a;--ac2:#382620}:root[data-acc=plum]:not([data-theme=light]){--ac:#c4a5d8;--ac2:#2e2536}}

*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.45 system-ui,-apple-system,"Segoe UI",sans-serif;-webkit-text-size-adjust:100%}

.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}.sp{justify-content:space-between;flex-wrap:nowrap;margin:6px 0}

.b{background:var(--card);border:1px solid var(--bd);border-radius:10px;padding:8px 14px}
.p{background:var(--ac);border-color:var(--ac);color:var(--card);font-weight:600}.p:disabled{opacity:.45}
.link{background:none;border:0;color:var(--ac);padding:6px;font-size:14px}
.ib{background:none;border:1px solid var(--bd);border-radius:50%;width:44px;padding:0;display:flex;align-items:center;justify-content:center;color:var(--mu)}

nav{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--bd);display:flex;justify-content:center;padding-bottom:env(safe-area-inset-bottom);z-index:5}

.rt td:first-child,.rt th:first-child{position:sticky;left:0;background:var(--card)}
ul{margin:6px 0;padding-left:20px}li{margin:3px 0}
.tn{display:flex;flex-direction:column;justify-content:center;gap:1px;line-height:1.25}.tn small{display:block}
.chip.part{border-style:dashed}.pill.warn{background:var(--wn);color:var(--wnt)}
h1{display:flex;align-items:center;gap:8px}details.card summary{gap:10px;align-items:center}details.card summary>span{min-width:0;overflow-wrap:anywhere}

.mx{color:var(--ac);font-weight:700}
.pdm{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;align-items:end;margin:6px 0 4px;border-bottom:3px solid var(--mu);border-radius:0 0 2px 2px}
.pdc{display:flex;flex-direction:column;align-items:center;text-align:center;min-width:0}
.pdn{font-size:14px;line-height:1.25;min-height:38px;display:flex;flex-direction:column;justify-content:flex-end;width:100%;margin-bottom:6px;overflow-wrap:anywhere}
.pds{width:100%;position:relative;overflow:hidden;background:var(--card);border-bottom:0;border-radius:4px 4px 0 0;box-shadow:0 3px 6px rgba(0,0,0,.12);display:flex;flex-direction:column;align-items:center;padding-top:8px;gap:2px}
.pds::before{content:"";position:absolute;left:0;right:0;top:0;height:10px;background:linear-gradient(rgba(255,255,255,.55),rgba(255,255,255,.15));border-bottom:1px solid var(--bd)}
.pds>:first-child{margin-top:6px}
.pds.s1{border:2px solid #b8962e;border-bottom:0;background:linear-gradient(rgba(184,150,46,.34),rgba(184,150,46,.12)),var(--card)}
.pds.s2{border:2px solid #8d949b;border-bottom:0;background:linear-gradient(rgba(141,148,155,.36),rgba(141,148,155,.14)),var(--card)}
.pds.s3{border:2px solid #a8683b;border-bottom:0;background:linear-gradient(rgba(168,104,59,.32),rgba(168,104,59,.12)),var(--card)}

@keyframes shm{to{transform:translateX(130%)}}@media(prefers-reduced-motion:reduce){.pds.go::after{display:none}}
.pds .big{font-size:22px;color:var(--tx)}.pds.s1 .big{font-size:26px}
.hrow{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}.hrow .pl{margin:0}
.tbar{display:block;height:4px;border-radius:2px;background:var(--bd);margin-top:4px;width:100%;max-width:64px;overflow:hidden}.tbar.fw{max-width:none;flex:1;margin-top:0}.tbar i{display:block;height:100%;background:var(--ac)}
.tb{display:flex;gap:2px;height:10px;margin:8px 0 4px}.tb i{border-radius:3px;background:var(--bd)}.tb i.hi{background:var(--ac)}.tl2{display:flex;justify-content:space-between;font-size:12px;color:var(--mu)}
.srch{position:relative;margin-bottom:12px}.srch input{width:100%;padding-left:38px;padding-right:40px}.srch .si{position:absolute;left:12px;top:13px;color:var(--mu);pointer-events:none}.srch .link{position:absolute;right:2px;top:0;font-size:22px}
.hc.nc{color:var(--mu)}.chip .sc{display:flex;flex-direction:column;align-items:flex-end;line-height:1.15;flex:none}.chip .sc small{font-size:11px;color:var(--mu)}
.tg{color:var(--ac);font-size:18px;line-height:1;margin-left:2px}
</style></head><body><div id="app">Loading…</div><div id="msg"></div>
<script>
const API_URL='https://script.google.com/macros/s/AKfycbylineVYJMcLU1wJTExM8rK9xNjlXQytHZJkhMixJj4GoMLaoH0UOidElepfzLV6J2Y/exec';
const S={code:localStorage.getItem('bgl_c')||'',player:localStorage.getItem('bgl_p')||'',pass:sessionStorage.getItem('bgl_a')||'',
  tab:'progress',view:'qual',rules:false,lb:'top',hv:'tier',hs:'12',ds:'new',ret:false,open:-1,atab:'ranking',sub:'awards',ev:null,edit:null,gt:{},imp:null,late:null,lmode:'game',admin:false,sec:'ranking',d:null,busy:false,s:null,g:null,done:null,q:'',err:''};
const $=q=>document.querySelector(q),val=id=>$('#'+id).value;
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const VERSION='v1.0';
const today=()=>{const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')};
const LOGO=n=>`<img src="icon-192.png" width="${n}" height="${n}" alt="" style="border-radius:22%;flex:none">`;
const pp=n=>n+(n===1?' person':' people');
const det=(k,def,sum,body,cls)=>`<details class="card ${cls||''}" ${(S.gt[k]===undefined?def:S.gt[k])?'open':''} ontoggle="S.gt['${k}']=this.open"><summary>${sum}</summary><div class="in">${body}</div></details>`;
const MON=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'],md=d=>MON[+d.slice(5,7)-1]+' '+(+d.slice(8,10)),fd=d=>md(d)+', '+d.slice(0,4),sp=s=>(s&&s.pts)||0;
const sn=id=>((S.d&&S.d.sn)||{})[id]?'#'+S.d.sn[id]+' · ':'',MD=d=>md(d).toUpperCase(),tp=(a,b)=>`<small>${a}/${b}</small><div class="tbar"><i style="width:${Math.min(100,Math.round(a/b*100))}%"></i></div>`,tpg=(t,a,b,pl,n)=>`<span style="flex:1;min-width:0"><span style="display:flex;justify-content:space-between;align-items:center"><b>Tier ${t}</b><small>${pl} of ${n} played</small></span><span style="display:flex;align-items:center;gap:8px;margin-top:6px"><span class="tbar fw"><i style="width:${Math.min(100,Math.round(a/b*100))}%"></i></span><small>${a}/${b}</small></span></span>`;
const sopt=(l,sel)=>{const by={};l.forEach(x=>(by[x.date.slice(0,4)]=by[x.date.slice(0,4)]||[]).push(x));return Object.keys(by).sort().reverse().map(y=>`<optgroup label="${y}">${by[y].map(x=>`<option value="${esc(x.id)}" ${x.id===sel?'selected':''}>${sn(x.id)}${MD(x.date)} · ${esc(x.hosts.join(', '))}</option>`).join('')}</optgroup>`).join('')};
const ord=i=>['1st','2nd','3rd'][i]||(i+1)+'th';
const tog=(a,v)=>{const i=a.indexOf(v);i<0?a.push(v):a.splice(i,1)};
const ICON={progress:'<path d="M4 20V11M10 20V4M16 20v-6M22 20H2"/>',log:'<rect x="4" y="4" width="16" height="16" rx="3"/><path d="M12 8v8M8 12h8"/>',
  board:'<path d="M8 4h8v5a4 4 0 0 1-8 0V4zM8 6H4v2a3 3 0 0 0 4 2.8M16 6h4v2a3 3 0 0 1-4 2.8M12 13v4M8 20h8M10 17h4"/>',
  rank:'<path d="M8 6h13M8 12h13M8 18h13M3 6h.01M3 12h.01M3 18h.01"/>',clip:'<rect x="6" y="4" width="12" height="17" rx="2"/><path d="M9 4h6v3H9zM9 12h6M9 16h4"/>',
  gear:'<circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/>',
    help:'<circle cx="12" cy="12" r="9"/><path d="M9.5 9a2.5 2.5 0 1 1 3.5 2.3c-.7.4-1 1-1 1.7M12 17h.01"/>',
  crown:'<path d="M3 8l4 4 5-7 5 7 4-4-2 11H5z"/>',
  thumb:'<path d="M10 15v4a3 3 0 0 0 3 3l4-9V2H5.7a2 2 0 0 0-2 1.7l-1.4 9a2 2 0 0 0 2 2.3zm7-13h2.7A2.3 2.3 0 0 1 22 4v7a2.3 2.3 0 0 1-2.3 2H17"/>',
  temple:'<path d="M3 9l9-5 9 5M5 9v9M9 9v9M15 9v9M19 9v9M3 20h18"/>',
  spark:'<path d="M12 3l1.8 5.2L19 10l-5.2 1.8L12 17l-1.8-5.2L5 10l5.2-1.8zM19 16l.8 2.2L22 19l-2.2.8L19 22l-.8-2.2L16 19l2.2-.8z"/>',
  medal:'<circle cx="12" cy="9" r="5"/><path d="M8.5 13.5L7 21l5-3 5 3-1.5-7.5"/>',
  lock:'<rect x="5" y="11" width="14" height="9" rx="2"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/>',
  salt:'<path d="M8.5 9V6a3.5 3.5 0 0 1 7 0v3M8 9h8l1 11a1 1 0 0 1-1 1H8a1 1 0 0 1-1-1zM11 6h.01M13 6h.01M12 7.8h.01"/>',
  shoe:'<path d="M5 3h4v9a3 3 0 0 0 6 0V3h4v9a7 7 0 0 1-14 0zM5 7h4M15 7h4"/>',
  mask:'<path d="M4 5c4 1 12 1 16 0v7a8 8 0 0 1-16 0zM7.5 10c.7-.8 1.8-.8 2.5 0M14 10c.7-.8 1.8-.8 2.5 0M8.5 14.5c1.8 2 5.2 2 7 0"/>',
  scale:'<path d="M12 3v18M7 21h10M5 7h14M5 7l-3 7a3.5 3.5 0 0 0 6 0zM19 7l-3 7a3.5 3.5 0 0 0 6 0z"/>',
  smile:'<circle cx="12" cy="12" r="9"/><path d="M8.5 14c1 1.5 2.2 2.2 3.5 2.2s2.5-.7 3.5-2.2M9 9.5h.01M15 9.5h.01"/>',
  rook:'<path d="M7 12V5h2v2h2V5h2v2h2V5h2v7zM8.5 12L8 20M15.5 12l.5 8M6 20h12"/>',
  search:'<circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/>'};
const svg=k=>`<svg viewBox="0 0 24 24">${ICON[k]}</svg>`;
const svgS=(k,n)=>`<svg viewBox="0 0 24 24" style="width:${n}px;height:${n}px;vertical-align:-3px">${ICON[k]}</svg>`;
function flash(t,ms){const m=$('#msg');m.textContent=t;m.style.display='block';clearTimeout(flash.t);flash.t=setTimeout(()=>m.style.display='none',ms||2800)}

/* ---------- data ---------- */
async function api(action,extra){
  const r=await fetch(API_URL,{method:'POST',body:JSON.stringify(Object.assign({code:S.code,player:S.player,pass:S.pass,action},extra||{}))});
  return r.json()}
async function load(){
  if(!S.code){render();return}
  S.busy=true;render();
  try{const r=await api('init');
    if(r.error==='code'){Object.keys(localStorage).filter(k=>k.startsWith('bgl_cache_')).forEach(k=>localStorage.removeItem(k));S.code='';localStorage.removeItem('bgl_c');S.err='That access code was not accepted.';S.d=null}
    else if(r.error){S.err=r.error}
    else{S.err='';S.d=r;r._t=Date.now();
      if(!r.admin&&S.player)localStorage.setItem('bgl_cache_'+S.player,JSON.stringify(r));
      if(S.pass&&!r.admin){S.pass='';sessionStorage.removeItem('bgl_a');S.passErr=r.locked?2:1}}}
  catch(e){S.err='Could not reach the server. Check your connection and the API_URL.'}
  S.busy=false;render()}
async function act(action,extra){
  flash('Saving…');
  try{const r=await api(action,extra);
    if(r.dup){$('#msg').style.display='none';return r}
    if(r.error){flash(r.error==='code'?'Access code not accepted':r.error,6000);return null}
    flash('Saved');await load();return r}
  catch(e){flash('Network error');return null}}
